<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#080d0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aydin Nutrition Pro">

<title>Aydin Nutrition Pro</title>

<style>

:root{
--bg:#080d0a;
--card:#121a15;
--card2:#1b251e;
--green:#65e48f;
--darkgreen:#277847;
--text:#f7faf7;
--muted:#929c95;
--line:#29342c;
--yellow:#efbc55;
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
}

.app{
max-width:680px;
margin:auto;
padding-bottom:100px;
}

header{
padding:55px 18px 18px;
}

.logo{
font-size:12px;
font-weight:900;
letter-spacing:2px;
color:var(--green);
}

h1{
font-size:32px;
margin:7px 0 3px;
}

.muted{
color:var(--muted);
font-size:13px;
}

/* NOW EAT */

.eat-card{
margin:12px 14px;
padding:25px 18px;
border-radius:25px;
background:linear-gradient(145deg,#173c25,#101711);
border:1px solid #347a4c;
text-align:center;
}

.eat-card.wait{
background:var(--card);
border-color:var(--line);
}

.status{
font-size:13px;
font-weight:900;
letter-spacing:1.5px;
color:var(--green);
}

.status.wait{
color:var(--muted);
}

.big{
font-size:38px;
font-weight:950;
margin:8px 0;
}

.food{
font-size:21px;
font-weight:900;
margin-top:8px;
}

.info{
font-size:13px;
color:var(--muted);
margin-top:7px;
}

.countdown{
margin-top:18px;
font-size:14px;
font-weight:800;
color:var(--green);
}

/* CARDS */

.card{
margin:12px 14px;
padding:20px;
background:var(--card);
border:1px solid var(--line);
border-radius:23px;
}

/* CALORIES */

.center{
text-align:center;
}

.progress{
height:9px;
background:#29342c;
border-radius:20px;
overflow:hidden;
margin:18px 0 7px;
}

.progress i{
display:block;
height:100%;
width:0%;
background:var(--green);
border-radius:20px;
}

/* MACROS */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px;
margin:12px 14px;
}

.macro{
background:var(--card);
border:1px solid var(--line);
border-radius:17px;
padding:14px 5px;
text-align:center;
}

.macro b{
display:block;
font-size:18px;
margin-top:5px;
}

/* SHIFT */

.shifts{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
}

.shift{
background:var(--card2);
border:1px solid var(--line);
border-radius:13px;
padding:12px 2px;
color:var(--text);
font-weight:800;
font-size:12px;
}

.shift.active{
background:var(--darkgreen);
border-color:var(--green);
}

/* MEALS */

.title{
font-size:18px;
font-weight:900;
margin-bottom:14px;
}

.meal{
display:flex;
gap:12px;
align-items:center;
padding:14px 0;
border-bottom:1px solid var(--line);
}

.meal:last-child{
border-bottom:0;
}

.icon{
width:45px;
height:45px;
border-radius:14px;
background:var(--card2);
display:grid;
place-items:center;
font-size:22px;
}

.mealmain{
flex:1;
}

.time{
font-size:12px;
font-weight:900;
color:var(--green);
}

.name{
font-weight:800;
margin-top:3px;
}

.detail{
font-size:12px;
color:var(--muted);
margin-top:4px;
}

/* BUTTONS */

button{
font-family:inherit;
cursor:pointer;
}

.add{
width:100%;
padding:16px;
border:0;
border-radius:16px;
background:var(--green);
color:#061008;
font-weight:900;
font-size:16px;
}

.secondary{
width:100%;
padding:14px;
border-radius:15px;
background:var(--card2);
border:1px solid var(--line);
color:var(--text);
font-weight:800;
margin-top:9px;
}

/* NAV */

.bottom{
position:fixed;
left:0;
right:0;
bottom:0;
height:76px;
background:rgba(8,13,10,.96);
backdrop-filter:blur(18px);
border-top:1px solid var(--line);
z-index:50;
}

.bottom-inner{
max-width:680px;
height:100%;
margin:auto;
display:grid;
grid-template-columns:repeat(3,1fr);
}

.nav{
background:none;
border:0;
color:var(--muted);
font-size:11px;
}

.nav.active{
color:var(--green);
}

.nav span{
display:block;
font-size:22px;
margin-bottom:2px;
}

/* PAGES */

.page{
display:none;
}

.page.active{
display:block;
}

/* INPUT */

input{
width:100%;
padding:14px;
border-radius:14px;
border:1px solid var(--line);
background:var(--card2);
color:var(--text);
font-size:16px;
margin:6px 0 10px;
outline:none;
}

label{
font-size:12px;
color:var(--muted);
display:block;
margin-top:10px;
}

/* WEEKEND */

.weekend{
text-align:center;
padding:10px;
border-radius:14px;
background:#302719;
border:1px solid #765b2b;
color:var(--yellow);
font-weight:900;
font-size:13px;
margin-top:10px;
}

</style>
<link rel="stylesheet" href="style.css">
</head>

<script src="app.js"></script>
<body>

<div class="app">

<!-- HEUTE -->

<section id="home" class="page active">

<header>

<div class="logo">
AYDIN NUTRITION PRO
</div>

<h1>
Dein Ernährungstag
</h1>

<div class="muted" id="date">
</div>

</header>


<!-- ESSENSSTATUS -->

<div class="eat-card" id="eatCard">

<div class="status" id="status">
PLAN WIRD GELADEN
</div>

<div class="big" id="statusBig">
—
</div>

<div class="food" id="currentFood">
—
</div>

<div class="info" id="currentInfo">
—
</div>

<div class="countdown" id="countdown">
—
</div>

</div>


<!-- KALORIEN -->

<div class="card center">

<div class="muted">
Heute gegessen
</div>

<div class="big">
<span id="kcal">0</span>
</div>

<div class="muted">
von <span id="goal">2200</span> kcal
</div>

<div class="progress">
<i id="kbar"></i>
</div>

<div class="muted">
Noch
<b style="color:var(--green)">
<span id="remaining">2200</span>
</b>
kcal
</div>

</div>


<!-- MAKROS -->

<div class="grid">

<div class="macro">
<div class="muted">
Protein
</div>
<b>
<span id="protein">0</span> g
</b>
</div>

<div class="macro">
<div class="muted">
KH
</div>
<b>
<span id="carbs">0</span> g
</b>
</div>

<div class="macro">
<div class="muted">
Fett
</div>
<b>
<span id="fat">0</span> g
</b>
</div>

</div>


<!-- SCHICHT -->

<div class="card">

<div class="title">
Dein Tag
</div>

<div class="shifts">

<button class="shift"
data-type="frueh"
onclick="setType('frueh')">
🌅 Früh
</button>

<button class="shift"
data-type="spaet"
onclick="setType('spaet')">
🌇 Spät
</button>

<button class="shift"
data-type="nacht"
onclick="setType('nacht')">
🌙 Nacht
</button>

<button class="shift"
data-type="weekend"
onclick="setType('weekend')">
🏖️ Wochenende
</button>

</div>

<div id="weekendMessage"></div>

</div>


<!-- ESSENSPLAN -->

<div class="card">

<div class="title">
🕐 Essensplan
</div>

<div id="plan">
</div>

</div>


<div class="card">

<button class="add"
onclick="quickMeal()">

＋ Mahlzeit eintragen

</button>

</div>

</section>


<!-- MAHLZEITEN -->

<section id="meals" class="page">

<header>

<div class="logo">
AYDIN NUTRITION PRO
</div>

<h1>
Mahlzeiten
</h1>

</header>

<div class="card">

<div id="mealList">
</div>

</div>

</section>


<!-- PROFIL -->

<section id="profile" class="page">

<header>

<div class="logo">
AYDIN NUTRITION PRO
</div>

<h1>
Profil
</h1>

</header>


<div class="card">

<div class="title">
⚙️ Kalorienziel
</div>

<label>
Tagesziel
</label>

<input
id="goalInput"
type="number"
value="2200"
>

<button
class="add"
onclick="saveGoal()">

Speichern

</button>

</div>


<div class="card">

<div class="title">
🎯 Abnehmziel
</div>

<div class="muted">
Startgewicht
</div>

<div style="font-size:30px;font-weight:900;margin:5px 0">
98 kg
</div>

<div class="muted">
Zielgewicht
</div>

<div style="font-size:30px;font-weight:900;margin:5px 0">
78 kg
</div>

</div>

</section>

</div>


<!-- NAV -->

<div class="bottom">

<div class="bottom-inner">

<button
class="nav active"
onclick="showPage('home',this)">
<span>⌂</span>
Heute
</button>

<button
class="nav"
onclick="showPage('meals',this)">
<span>🍽️</span>
Mahlzeiten
</button>

<button
class="nav"
onclick="showPage('profile',this)">
<span>⚙️</span>
Profil
</button>

</div>

</div>


<script>


/* =========================
   ESSENSPLÄNE
========================= */


const plans={


frueh:[

{
time:"06:00",
name:"Frühstück",
food:"🥚 3 Eier + Skyr + Apfel",
kcal:450,
p:35
},

{
time:"10:00",
name:"Mittagessen",
food:"🍗 Hähnchen + Reis + Gemüse",
kcal:650,
p:55
},

{
time:"14:30",
name:"Snack",
food:"🥤 Whey + Banane",
kcal:300,
p:28
},

{
time:"18:00",
name:"Abendessen",
food:"🐟 Lachs + Kartoffeln + Gemüse",
kcal:600,
p:45
}

],


spaet:[

{
time:"09:00",
name:"Frühstück",
food:"🥣 Skyr + Beeren + Haferflocken",
kcal:450,
p:35
},

{
time:"13:30",
name:"Mittagessen",
food:"🍗 Hähnchen + Reis + Gemüse",
kcal:650,
p:55
},

{
time:"17:00",
name:"Pre-Workout",
food:"🥤 Whey + Banane",
kcal:300,
p:28
},

{
time:"22:00",
name:"Abendessen",
food:"🐟 Lachs + Kartoffeln + Gemüse",
kcal:600,
p:45
}

],


nacht:[

{
time:"15:30",
name:"Erste Mahlzeit",
food:"🥣 Skyr + Beeren + Haferflocken",
kcal:450,
p:35
},

{
time:"18:00",
name:"Hauptmahlzeit",
food:"🍗 Hähnchen + Reis + Gemüse",
kcal:650,
p:55
},

{
time:"22:00",
name:"Snack",
food:"🥤 Whey + Banane",
kcal:300,
p:28
},

{
time:"02:00",
name:"Nachtmahlzeit",
food:"🐟 Thunfisch + Kartoffeln + Gemüse",
kcal:500,
p:45
},

{
time:"07:30",
name:"Vor dem Schlafen",
food:"🥣 Skyr / Magerquark",
kcal:300,
p:30
}

],


/* WOCHENENDE */

weekend:[

{
time:"09:00",
name:"Frühstück",
food:"🥚 Eier + Skyr + Obst",
kcal:500,
p:40
},

{
time:"13:30",
name:"Mittagessen",
food:"🍗 Hähnchen + Reis + Gemüse",
kcal:650,
p:55
},

{
time:"17:00",
name:"Snack",
food:"🥤 Whey + Banane",
kcal:300,
p:28
},

{
time:"20:00",
name:"Abendessen",
food:"🐟 Lachs + Kartoffeln + Gemüse",
kcal:600,
p:45
}

]

};


/* =========================
   DATEN
========================= */


let data=
JSON.parse(
localStorage.getItem("aydinNutritionPro")
||"{}"
);

data.goal=data.goal||2200;

data.type=data.type||null;

data.meals=data.meals||[];


/* =========================
   WOCHENENDE AUTOMATISCH
========================= */


function isWeekend(){

const day=new Date().getDay();

return day===0 || day===6;

}


function getTodayType(){

/*

Samstag und Sonntag:
automatisch Wochenende.

Werktage:
gespeicherte Schicht.

*/

if(isWeekend()){

return "weekend";

}

return data.type || "frueh";

}


/* =========================
   ZEIT
========================= */


function nowMinutes(){

const d=new Date();

return d.getHours()*60+d.getMinutes();

}


function toMinutes(time){

const parts=time.split(":");

return Number(parts[0])*60+
Number(parts[1]);

}


/* =========================
   JETZT ESSEN
========================= */


function renderEatNow(){

const type=getTodayType();

const plan=plans[type];

const now=nowMinutes();

let current=null;

let next=null;


for(let i=0;i<plan.length;i++){

const meal=plan[i];

const time=toMinutes(meal.time);

if(now>=time){

current=meal;

}

if(time>now){

next=meal;

break;

}

}


/*

Wenn alle Mahlzeiten vorbei sind,
wird die erste Mahlzeit des nächsten
Tages als nächste angezeigt.

*/

if(!next){

next=plan[0];

}


/* Keine aktuelle Mahlzeit */

if(!current){

showNext(next);

return;

}


const mealTime=toMinutes(current.time);

const passed=now-mealTime;


/*

90 Minuten Zeitfenster.

*/

if(passed>=0 && passed<90){

const card=document.getElementById("eatCard");

card.classList.remove("wait");

document.getElementById("status").className="status";

document.getElementById("status").innerText=
"🟢 JETZT ESSEN";

document.getElementById("statusBig").innerText=
current.time;

document.getElementById("currentFood").innerText=
current.food;

document.getElementById("currentInfo").innerText=
current.kcal+
" kcal · "+
current.p+
" g Protein";

if(next){

document.getElementById("countdown").innerText=
"Nächste Mahlzeit: "+
next.time;

}else{

document.getElementById("countdown").innerText=
"Letzte geplante Mahlzeit";

}

return;

}


/* Nächste Mahlzeit */

showNext(next);

}


/* =========================
   NÄCHSTE MAHLZEIT
========================= */


function showNext(meal){

const card=document.getElementById("eatCard");

card.classList.add("wait");

const status=document.getElementById("status");

status.className="status wait";

status.innerText=
"NÄCHSTE MAHLZEIT";

document.getElementById("statusBig").innerText=
meal.time;

document.getElementById("currentFood").innerText=
meal.food;

document.getElementById("currentInfo").innerText=
meal.kcal+
" kcal · "+
meal.p+
" g Protein";


const now=nowMinutes();

let diff=
toMinutes(meal.time)-now;

if(diff<0){

diff+=1440;

}

const hours=
Math.floor(diff/60);

const minutes=
diff%60;


document.getElementById("countdown").innerText=
"⏱️ Noch "+
hours+
" Std. "+
minutes+
" Min.";

}


/* =========================
   PLAN ANZEIGEN
========================= */


function renderPlan(){

const type=getTodayType();

const plan=plans[type];

const container=
document.getElementById("plan");

container.innerHTML="";


plan.forEach(meal=>{

container.innerHTML+=`

<div class="meal">

<div class="icon">
${meal.food.substring(0,2)}
</div>

<div class="mealmain">

<div class="time">
${meal.time}
</div>

<div class="name">
${meal.name}
</div>

<div class="detail">
${meal.food.substring(3)}
· ${meal.kcal} kcal
· ${meal.p} g Protein
</div>

</div>

</div>

`;

});


/* Schichtbuttons */

document
.querySelectorAll(".shift")
.forEach(btn=>{

btn.classList.toggle(
"active",
btn.dataset.type===type
);

});


const message=
document.getElementById("weekendMessage");


if(type==="weekend"){

message.innerHTML=
`
<div class="weekend">
🏖️ WOCHENEND-MODUS AKTIV<br>
<span style="font-weight:600">
Keine Schicht – dein eigener Wochenendplan.
</span>
</div>
`;

}else{

message.innerHTML="";

}

}


/* =========================
   KALORIEN
========================= */


function renderTotals(){

const today=
new Date().toDateString();

const meals=
data.meals.filter(
m=>m.date===today
);

let kcal=0;
let p=0;
let c=0;
let f=0;


meals.forEach(m=>{

kcal+=Number(m.kcal)||0;

p+=Number(m.p)||0;

c+=Number(m.c)||0;

f+=Number(m.f)||0;

});


document.getElementById("kcal").innerText=
Math.round(kcal);

document.getElementById("protein").innerText=
Math.round(p);

document.getElementById("carbs").innerText=
Math.round(c);

document.getElementById("fat").innerText=
Math.round(f);

document.getElementById("goal").innerText=
data.goal;

document.getElementById("remaining").innerText=
Math.max(data.goal-kcal,0);

document.getElementById("kbar").style.width=
Math.min(100,kcal/data.goal*100)+"%";

}


/* =========================
   MAHLZEITEN
========================= */


function renderMeals(){

const list=
document.getElementById("mealList");

const today=
new Date().toDateString();

const meals=
data.meals.filter(
m=>m.date===today
);


if(!meals.length){

list.innerHTML=
`
<div class="muted">
Noch keine Mahlzeiten heute.
</div>
`;

return;

}


list.innerHTML="";


meals.forEach(meal=>{

list.innerHTML+=`

<div class="meal">

<div class="icon">
🍽️
</div>

<div class="mealmain">

<div class="time">
${meal.time}
</div>

<div class="name">
${meal.name}
</div>

<div class="detail">
${meal.kcal} kcal ·
${meal.p} g Protein
</div>

</div>

</div>

`;

});

}


/* =========================
   SCHICHT
========================= */


function setType(type){

/*

Am Wochenende kann der Benutzer
manuell den Wochenendmodus wählen.

*/

data.type=type;

localStorage.setItem(
"aydinNutritionPro",
JSON.stringify(data)
);

render();

}


/* =========================
   MAHLZEIT SCHNELL EINTRAGEN
========================= */


function quickMeal(){

const name=
prompt(
"Mahlzeit:",
"Hähnchen + Reis + Gemüse"
);

if(!name)return;


const kcal=
Number(
prompt(
"Kalorien:",
"650"
)
)||0;


const protein=
Number(
prompt(
"Protein:",
"55"
)
)||0;


data.meals.unshift({

date:new Date().toDateString(),

time:new Date().toLocaleTimeString(
"de-DE",
{
hour:"2-digit",
minute:"2-digit"
}
),

name:name,

kcal:kcal,

p:protein,

c:0,

f:0

});


localStorage.setItem(
"aydinNutritionPro",
JSON.stringify(data)
);

render();

}


/* =========================
   KALORIENZIEL
========================= */


function saveGoal(){

const value=
Number(
document.getElementById("goalInput").value
);

if(value>0){

data.goal=value;

localStorage.setItem(
"aydinNutritionPro",
JSON.stringify(data)
);

render();

alert(
"Kalorienziel gespeichert."
);

}

}


/* =========================
   SEITEN
========================= */


function showPage(id,button){

document
.querySelectorAll(".page")
.forEach(page=>
page.classList.remove("active")
);

document
.getElementById(id)
.classList.add("active");


document
.querySelectorAll(".nav")
.forEach(nav=>
nav.classList.remove("active")
);

button.classList.add("active");

window.scrollTo(0,0);

}


/* =========================
   HAUPTRENDER
========================= */


function render(){

const today=
new Date();

document.getElementById("date").innerText=
today.toLocaleDateString(
"de-DE",
{
weekday:"long",
day:"numeric",
month:"long"
}
);


/*

Am Wochenende automatisch
Wochenendmodus.

*/

if(isWeekend()){

if(data.type!=="weekend"){

data.type="weekend";

localStorage.setItem(
"aydinNutritionPro",
JSON.stringify(data)
);

}

}


document.getElementById("goalInput").value=
data.goal;


renderEatNow();

renderPlan();

renderTotals();

renderMeals();

}


/* =========================
   AUTOMATISCHE AKTUALISIERUNG
========================= */


/*

Alle 30 Sekunden prüfen.

Damit wird beispielsweise aus:

"Noch 5 Minuten"

automatisch:

"🟢 JETZT ESSEN"

*/

setInterval(
render,
30000
);


render();

</script>

</body>
</html>
